upstream php {
    server unix:/run/php/php8.3-fpm.sock;
    server unix:/run/php-fpm/php-fpm.sock backup;
    # server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.php index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'" always;
    # HSTS - enable only if you have HTTPS (uncomment)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location = /favicon.ico { log_not_found off; access_log off; }

    location ~ ^/_sayanet/private/ {
        deny all;
        return 404;
    }

    location ~ ^/_h5ai/private/ {
        deny all;
        return 404;
    }

    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/_sayanet/public/cache/ {
        expires 1M;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        client_max_body_size 100M;
        fastcgi_read_timeout 300;
        fastcgi_param REMOTE_ADDR $remote_addr;
    }

    location / {
        try_files $uri $uri/ /_sayanet/public/index.php?$query_string;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location ~ /\.ht { deny all; }

    location = /_sayanet/health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

