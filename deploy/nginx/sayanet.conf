# nginx config for sayanet - optimized for performance + security
# Place in /etc/nginx/conf.d/sayanet.conf or include from nginx.conf
# Tested with nginx 1.24+ and php8.3-fpm

# Upstream php
upstream php {
    server unix:/run/php/php8.3-fpm.sock; # or 127.0.0.1:9000
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.php index.html;

    # Security headers (also set in php, but nginx is primary)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'" always;
    # HSTS - enable only if you have HTTPS (uncomment)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Don't log favicon 404
    location = /favicon.ico { log_not_found off; access_log off; }

    # Deny access to private
    location ~ ^/_sayanet/private/ {
        deny all;
        return 404;
    }
    # Also deny legacy _h5ai
    location ~ ^/_h5ai/private/ {
        deny all;
        return 404;
    }

    # Cache static assets - 1 year for versioned js/css, 1 week for others
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Thumbnails - allow php to generate, but cache
    location ~ ^/_sayanet/public/cache/ {
        expires 1M;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Protect against HTTPoxy
        fastcgi_param HTTP_PROXY "";
        # Increase for large uploads
        client_max_body_size 100M;
        fastcgi_read_timeout 300;
        # Pass real IP if behind proxy
        fastcgi_param REMOTE_ADDR $remote_addr;
    }

    # Directory listing via sayanet - try sayanet first, then static index
    location / {
        # First try to serve sayanet's index.php for directories
        # This allows /folder/ to be handled by sayanet
        try_files $uri $uri/ /_sayanet/public/index.php?$query_string;
        # Rate limiting - generous for public (requires limit_req_zone in http block)
        # limit_req zone=public burst=50 nodelay;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hide .htaccess
    location ~ /\.ht { deny all; }

    # Health check
    location = /_sayanet/health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# Rate limiting zones (add to http block in nginx.conf)
# limit_req_zone $binary_remote_addr zone=public:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/m;
