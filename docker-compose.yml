services:
  sayanet:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./build/_sayanet:/var/www/html/_sayanet:ro
      - ./demo:/var/www/html/demo:ro
    environment:
      - SAYANET_ROOT_PATH=/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/_sayanet/public/js/scripts.js"]
      interval: 30s
      timeout: 3s
      retries: 3
