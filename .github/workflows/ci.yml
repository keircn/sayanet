name: CI

on:
  push:
    branches: [master, dev, main]
  pull_request:
    branches: [master, dev, main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, json, mbstring, exif
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build (ghu legacy)
        run: pnpm run build

      - name: Build (vite modern)
        run: pnpm run build:vite

      - name: Check build artifacts
        run: |
          ls -lh build/_sayanet/public/js/scripts.js
          ls -lh build/_sayanet/public/css/styles.css
          ls -lh build/sayanet-*.zip 2>&1 | head

      - name: PHP syntax check
        run: find src/_sayanet/private/php -name "*.php" -exec php -l {} \;

  docker:
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sayanet:test .
      - name: Run container smoke test
        run: |
          docker run -d -p 8080:80 --name sayanet-test sayanet:test
          sleep 5
          curl -f http://localhost:8080/_sayanet/public/js/scripts.js | head -c 100
          docker rm -f sayanet-test
